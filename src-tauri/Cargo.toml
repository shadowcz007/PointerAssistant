[package]
name = "cursor-prompt"
version = "0.1.0"
description = "A desktop application that shows a cursor with text prompts"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta.10", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta.10", features = ["window-all", "shell-open", "process-exit", "process-relaunch", "globalShortcut-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]